services:
  - type: web
    name: niazi-md-mini-beta
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: OWNER_NUMBER
        value: "923220225993"
      - key: MAX_USERS
        value: "8"
